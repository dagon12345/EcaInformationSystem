    <style>
        .first-load-note {
            font-size: 10px;
            color: #6FA8DC;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 18px;
            letter-spacing: 0.3px;
        }

        .loading-resource {
            font-size: 10px;
            color: #6b8db5;
            margin-top: 6px;
            font-family: 'Consolas', 'Courier New', monospace;
            max-width: 220px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-height: 14px;
        }

        /* Same gradient + drifting-blob language as the public Features hero
           (see .features-hero/.features-hero-glow in auth-shared.css) —
           this is the very first thing anyone sees, so it should already
           look like the rest of the app instead of a plain flat splash. */
        #blazor-loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at 20% 20%, #0C447C, #042C53 60%);
            z-index: 9999;
            font-family: sans-serif;
            transition: opacity 0.4s ease;
        }

        .loading-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.5;
            pointer-events: none;
            animation: loading-drift 14s ease-in-out infinite;
        }
        .loading-glow--1 { width: 320px; height: 320px; background: #378ADD; top: -100px; left: -60px; }
        .loading-glow--2 { width: 260px; height: 260px; background: #f97316; bottom: -80px; right: -40px; animation-delay: -4s; }
        .loading-glow--3 { width: 220px; height: 220px; background: #a855f7; top: 55%; left: 65%; animation-delay: -8s; }

        @keyframes loading-drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -20px) scale(1.15); }
        }

        .loader-box {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeUp 0.6s ease both;
        }

        .loader-kicker {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 22px;
            padding: 4px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.22);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: #cfe3f9;
        }
        .loader-kicker-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 6px #4ade80;
            animation: pulse-dot 1.6s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .logo-ring {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 28px;
        }

        .spin-ring {
            position: absolute;
            top: 0;
            left: 0;
            animation: spin 1.4s linear infinite;
        }

        .logo-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 54px;
            height: 54px;
            background: #0C447C;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            animation: logo-glow 2.6s ease-in-out infinite;
        }
        @keyframes logo-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(133,183,235,0.35); }
            50% { box-shadow: 0 0 0 10px rgba(133,183,235,0); }
        }

        .app-name {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-shadow: 0 0 20px rgba(133, 183, 235, 0.5);
        }

        .app-sub {
            font-size: 10px;
            color: #85B7EB;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        .progress-track {
            position: relative;
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.12);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-bar {
            position: relative;
            height: 100%;
            background: linear-gradient(90deg, #185FA5, #85B7EB, #185FA5);
            background-size: 200% auto;
            border-radius: 999px;
            animation: barLoad 2.2s ease-in-out infinite alternate, shimmer-move 2.5s linear infinite;
            box-shadow: 0 0 10px rgba(133, 183, 235, 0.6);
        }
        @keyframes shimmer-move {
            to { background-position: -200% center; }
        }

        .loading-text {
            font-size: 11px;
            color: #B5D4F4;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            animation: pulse 1.8s ease-in-out infinite;
        }

        .dots span {
            display: inline-block;
            animation: pulse 1.4s ease-in-out infinite;
        }

            .dots span:nth-child(2) {
                animation-delay: 0.2s;
            }

            .dots span:nth-child(3) {
                animation-delay: 0.4s;
            }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0%,100% {
                opacity: 1
            }

            50% {
                opacity: 0.4
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes barLoad {
            from {
                width: 0
            }

            to {
                width: 100%
            }
        }

        .loading-tip-card {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 300px;
            margin-top: 30px;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            backdrop-filter: blur(4px);
        }
        .loading-tip-icon {
            flex-shrink: 0;
            font-size: 20px;
        }
        .loading-tip-body {
            min-width: 0;
        }
        .loading-tip-label {
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #85B7EB;
            margin-bottom: 2px;
        }
        .loading-tip-text {
            font-size: 12px;
            line-height: 1.5;
            color: #dce8f6;
        }
        /* Re-triggered on every rotation by the JS below (remove + reflow +
           re-add), rather than a plain CSS transition, so each new tip fades
           in fresh instead of only animating once on first paint. */
        .loading-tip-icon.tip-enter,
        .loading-tip-text.tip-enter {
            animation: tip-fade-in 0.4s ease;
        }
        @keyframes tip-fade-in {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 420px) {
            .loading-tip-card {
                max-width: 240px;
            }
        }
    </style>

    <script>
        window.triggerFileDownload = async function (url, fileName, token) {
            const response = await fetch(url, {
                method: "GET",
                credentials: "include",
                headers: {
                    "Authorization": "Bearer " + token  // ✅ attach JWT
                }
            });

            if (!response.ok) {
                console.error("Download failed:", response.status, response.statusText);
                return;
            }

            const blob = await response.blob();
            const objectUrl = window.URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = objectUrl;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            link.remove();
            window.URL.revokeObjectURL(objectUrl);
        };

        // ✅ Creates a blob URL from base64 PDF data — no auth needed for iframe
        window.createPdfBlobUrl = function (base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            const blob = new Blob([bytes], { type: "application/pdf" });
            return URL.createObjectURL(blob);
        };

        // Faster path for PreviewAsync — takes a .NET stream reference instead of
        // a base64 string, so the bytes arrive as a binary ArrayBuffer directly
        // (Blazor's built-in stream interop) rather than paying for a
        // Convert.ToBase64String on the C# side (+33% payload) followed by a
        // synchronous atob/charCodeAt loop here that blocks the main thread and
        // visibly stalls large PDFs.
        window.createPdfBlobUrlFromStream = async function (streamRef) {
            const arrayBuffer = await streamRef.arrayBuffer();
            const blob = new Blob([arrayBuffer], { type: "application/pdf" });
            return URL.createObjectURL(blob);
        };

        window.webcamInterop = {
            stream: null,
            async start(videoElementId) {
                const video = document.getElementById(videoElementId);
                try {
                    this.stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" },
                        audio: false
                    });
                    video.srcObject = this.stream;
                    await video.play();
                    return true;
                } catch (err) {
                    console.error("Webcam access denied or unavailable:", err);
                    return false;
                }
            },
            capture(videoElementId, canvasElementId) {
                const video = document.getElementById(videoElementId);
                const canvas = document.getElementById(canvasElementId);
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL("image/jpeg", 0.92);
            },
            stop() {
                if (this.stream) {
                    this.stream.getTracks().forEach(t => t.stop());
                    this.stream = null;
                }
            }
        };
        // ✅ Revokes blob URL to free memory when viewer is closed
        window.revokeBlobUrl = function (url) {
            URL.revokeObjectURL(url);
        };
    </script>

    <script>
        window.downloadFile = function (fileName, base64, contentType) {
            try {
                const byteChars = atob(base64);
                const byteNumbers = new Array(byteChars.length);
                for (let i = 0; i < byteChars.length; i++) {
                    byteNumbers[i] = byteChars.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: contentType || 'application/octet-stream' });

                const blobUrl = URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Free memory shortly after — don't revoke immediately or some
                // mobile browsers cancel the download before it starts.
                setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
            } catch (err) {
                console.error('Download failed:', err);
                alert('Download failed. Please try again.');
            }
        };
    </script>

    <script>
        (function () {
            // Set by hardReload.js right before it reloads the page, in response
            // to the in-app "Refresh Now" button — read-and-clear once so only
            // that one load bypasses the disk cache for every framework file
            // (.dll/.wasm/blazor.boot.json), matching Ctrl+Shift+R. Normal
            // reloads/navigations keep using the cache as usual.
            const fetchCacheMode = sessionStorage.getItem('ecaForceHardReload') === '1' ? 'reload' : 'default';
            sessionStorage.removeItem('ecaForceHardReload');

            let totalBytes = 0;
            let loadedBytes = 0;
            let resourceCount = 0;
            let resourcesDone = 0;

            const progressBar = document.querySelector('.progress-bar');
            const pctText = document.getElementById('loading-pct');
            const resourceText = document.getElementById('loading-resource');

            // Rotating "did you know" tips — first-time visitors are stuck
            // watching this screen for however long the WASM payload takes
            // on their connection, so give them something worth reading
            // (and a quick product tour) instead of a bare spinner.
            const tips = [
                { icon: '📥', text: 'Bulk import hundreds of grantee records from Excel in seconds.' },
                { icon: '🔍', text: 'Every new record is auto-checked for duplicates — name, birth date, OSCA ID, RRN.' },
                { icon: '🎂', text: 'Grantees turning 80 are automatically flagged as newly eligible.' },
                { icon: '📄', text: 'Generate CDRs, payrolls, and Certificates of Eligibility straight from validated records.' },
                { icon: '🔔', text: 'Get instant alerts the moment a document is handed off to you.' },
                { icon: '💬', text: 'Chat, call, and collaborate with your team — right inside the system.' },
                { icon: '🏆', text: 'A weekly leaderboard turns everyday work into friendly competition.' },
                { icon: '🔒', text: 'Two-factor authentication keeps every account secure.' },
                { icon: '📊', text: 'See grantee counts and progress visualized across the whole region.' },
                { icon: '⚡', text: 'Every hand-off, edit, and payment is logged — nothing slips through unnoticed.' },
                { icon: '👥', text: 'Crossmatch an entire grantee list before importing — nothing saves until you say so.' },
                { icon: '🗺️', text: 'A searchable directory covers senior citizen population and welfare data by municipality.' },
                { icon: '🖐️', text: 'Biometric Daily Time Records are generated automatically from fingerprint punches.' },
                { icon: '📌', text: 'Flag a record with a finding or compliance remark, with a full note history attached.' },
                { icon: '📅', text: 'A shared calendar and sticky notes keep the whole team on the same page.' }
            ];
            const tipIcon = document.getElementById('loading-tip-icon');
            const tipText = document.getElementById('loading-tip-text');
            let lastTipIndex = -1;
            let tipTimer = null;

            function nextRandomTipIndex() {
                if (tips.length <= 1) return 0;
                let index;
                do {
                    index = Math.floor(Math.random() * tips.length);
                } while (index === lastTipIndex);
                return index;
            }

            function showRandomTip() {
                if (!tipIcon || !tipText) return;
                lastTipIndex = nextRandomTipIndex();
                const tip = tips[lastTipIndex];
                tipIcon.textContent = tip.icon;
                tipText.textContent = tip.text;

                // Restart the fade-in animation on every rotation (a class
                // already present doesn't re-fire its animation, so drop it,
                // force a reflow, then re-add it).
                tipIcon.classList.remove('tip-enter');
                tipText.classList.remove('tip-enter');
                void tipIcon.offsetWidth;
                tipIcon.classList.add('tip-enter');
                tipText.classList.add('tip-enter');
            }

            if (tipIcon && tipText) {
                showRandomTip();
                tipTimer = setInterval(showRandomTip, 3500);
            }

            function shortName(url) {
                // Strip query string and path, keep just the filename
                const clean = url.split('?')[0];
                return clean.substring(clean.lastIndexOf('/') + 1);
            }

            function updateUI(currentFile) {
                const pct = totalBytes > 0
                    ? Math.min(100, Math.round((loadedBytes / totalBytes) * 100))
                    : Math.round((resourcesDone / Math.max(resourceCount, 1)) * 100);

                if (progressBar) {
                    progressBar.style.animation = 'none';
                    progressBar.style.width = pct + '%';
                }
                if (pctText) {
                    pctText.textContent = 'Loading ' + pct + '%';
                }
                if (resourceText && currentFile) {
                    resourceText.textContent = currentFile;
                }
            }

            async function trackedFetch(url) {
                resourceCount++;
                const fileName = shortName(url);
                updateUI(fileName);

                const response = await fetch(url, { cache: fetchCacheMode });
                const contentLength = response.headers.get('content-length');
                const size = contentLength ? parseInt(contentLength, 10) : 0;
                if (size > 0) totalBytes += size;

                if (!response.body || !window.ReadableStream) {
                    resourcesDone++;
                    if (size > 0) loadedBytes += size;
                    updateUI(fileName);
                    return response;
                }

                const reader = response.body.getReader();
                const chunks = [];
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    loadedBytes += value.length;
                    updateUI(fileName);
                }
                resourcesDone++;
                const blob = new Blob(chunks);
                return new Response(blob, {
                    status: response.status,
                    statusText: response.statusText,
                    headers: response.headers
                });
            }

            Blazor.start({
                loadBootResource: function (type, name, defaultUri, integrity) {
                    if (type === 'dotnetjs') {
                        return defaultUri;
                    }
                    return trackedFetch(defaultUri);
                }
            }).then(function () {
                if (resourceText) resourceText.textContent = 'Ready!';
                if (tipTimer) clearInterval(tipTimer);
                const splash = document.getElementById('blazor-loading');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(function () { splash.remove(); }, 400);
                }
            });
        })();
    </script>
