<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECAReS</title>
    <base href="/" />
    <link href="_content/Havit.Blazor.Components.Web.Bootstrap/bootstrap.min.css?v=2.0.0%2Bc21d8dd7f78b4928a5dbf9123c0f4c2ab9f8b30a" rel="stylesheet" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="EcaInformationSystem.Client.styles.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <script type="importmap"></script>
    <style>
        #blazor-loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #042C53;
            z-index: 9999;
            font-family: sans-serif;
            transition: opacity 0.4s ease;
        }

        .loader-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeUp 0.6s ease both;
        }

        .logo-ring {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 28px;
        }

        .spin-ring {
            position: absolute;
            top: 0;
            left: 0;
            animation: spin 1.4s linear infinite;
        }

        .logo-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 54px;
            height: 54px;
            background: #0C447C;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .app-name {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .app-sub {
            font-size: 10px;
            color: #85B7EB;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        .progress-track {
            width: 180px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #185FA5, #85B7EB);
            border-radius: 2px;
            animation: barLoad 2.2s ease-in-out infinite alternate;
        }

        .loading-text {
            font-size: 11px;
            color: #B5D4F4;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            animation: pulse 1.8s ease-in-out infinite;
        }

        .dots span {
            display: inline-block;
            animation: pulse 1.4s ease-in-out infinite;
        }

            .dots span:nth-child(2) {
                animation-delay: 0.2s;
            }

            .dots span:nth-child(3) {
                animation-delay: 0.4s;
            }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0%,100% {
                opacity: 1
            }

            50% {
                opacity: 0.4
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes barLoad {
            from {
                width: 0
            }

            to {
                width: 100%
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- Loading splash — hidden once Blazor is ready -->
        <div id="blazor-loading">
            <div class="loader-box">
                <div class="logo-ring">
                    <svg class="spin-ring" width="80" height="80" viewBox="0 0 80 80">
                        <circle cx="40" cy="40" r="36" fill="none"
                                stroke="#0C447C" stroke-width="2" />
                        <circle cx="40" cy="40" r="36" fill="none"
                                stroke="#378ADD" stroke-width="2"
                                stroke-dasharray="60 166" stroke-linecap="round" />
                    </svg>
                    <div class="logo-inner">ECA</div>
                </div>
                <div class="app-name">ECAReS</div>
                <div class="app-sub">Caraga Region</div>
                <div class="progress-track">
                    <div class="progress-bar"></div>
                </div>
                <div class="loading-text">
                    Loading<span class="dots">
                        <span>.</span><span>.</span><span>.</span>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
    </div>
    <script>
        window.downloadFile = function (fileName, base64) {
            const link = document.createElement('a');
            link.download = fileName;
            link.href = 'data:application/octet-stream;base64,' + base64;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <!-- Add your script here for downloading the template -->
    <script src="js/fileDownload.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</body>

</html>
